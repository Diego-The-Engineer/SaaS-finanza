<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Finanzas</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>SaaS Finanzas Dashboard</h1>
        <div class="card">
            <h2>Registrar Movimiento</h2>
            <form id="form-movimiento">
                <div class="form-group">
                    <label for="id_tipo">Tipo</label>
                    <select id="id_tipo" required>
                        <option value="">Selecciona tipo...</option>
                        <option value="Ingreso">Ingreso</option>
                        <option value="Egreso">Egreso</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="id_concepto">Concepto</label>
                    <select id="id_concepto" required>
                        <option value="">Primero selecciona el Tipo...</option>
                    </select>
                <div class="concept-actions">
                    <button type="button" id="btnAgregar" class="btn-action btn-add"> + Agregar Concepto </button>
                    <button type="button" id="btnEditar" class="btn-action btn-update"> > Editar Concepto </button>
                    <button type="button" id="btnEliminar" class="btn-action btn-delete"> - Eliminar Concepto </button>
                </div>
                </div>
                <div class="form-group">
                    <label for="monto">Monto ($)</label>
                    <input type="number" id="monto" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="fecha">Fecha de Operación</label>
                    <input type="date" id="fecha" required>
                </div>
                <div class="form-group">
                    <label for="notas">Notas</label>
                    <textarea id="notas" rows="3"></textarea>
                </div>
                <button type="submit">Guardar Registro</button>
            </form>
        </div>
        <div class="card">
            <h2>Gráficas de Rendimiento</h2>
            <div class="flex-charts">
                <div class="chart-container">
                    <h3>Ingresos por Categoría</h3>
                    <canvas id="graficoIngresos"></canvas>
                </div>
                <div class="chart-container">
                    <h3>Egresos por Categoría</h3>
                    <canvas id="graficoEgresos"></canvas>
                </div>
            </div>
        </div>
        <div class="card">
            <h2>Últimos Movimientos</h2>
            <div class="filters">
                <label for="filtro-mes">Filtrar por Mes</label>
                <select id="filtro-mes" onchange="cargarMovimientos()">
                    <option value="">Todos los meses</option>
                    <option value="01">Enero</option>
                    <option value="02">Febrero</option>
                    <option value="03">Marzo</option>
                    <option value="04">Abril</option>
                    <option value="05">Mayo</option>
                    <option value="06" selected>Junio</option>
                    <option value="07">Julio</option>
                    <option value="08">Agosto</option>
                    <option value="09">Septiembre</option>
                    <option value="10">Octubre</option>
                    <option value="11">Noviembre</option>
                    <option value="12">Diciembre</option>
                </select>
                <br><br>
                <button onclick="filtrarTipo('')">Todos</button>
                <button onclick="filtrarTipo('Ingreso')">Ingresos</button>
                <button onclick="filtrarTipo('Egreso')">Egresos</button>
            </div>
            <ul id="lista-movimientos"></ul>
        </div>
    </div>
    <div id="modalAgregar" class="modal-overlay" style="display: none;">
        <div class="modal-content card">
            <h3>Agregar Nuevo Concepto</h3>
            
            <div class="form-group">
                <label>Nombre del Concepto:</label>
                <input type="text" id="modalNombre" placeholder="Ej. Pago de Internet">
            </div>

            <div class="form-group">
                <label>Tipo:</label>
                <select id="modalTipo">
                    <option value="Ingreso">Ingreso</option>
                    <option value="Egreso">Egreso</option>
                </select>
            </div>

            <div class="form-group">
                <label>Categoría Padre:</label>
                <input type="text" id="modalCategoria" placeholder="Ej. Servicios">
            </div>

            <div class="concept-actions">
                <button type="button" id="btnGuardarModal" class="btn-action btn-add">Guardar</button>
                <button type="button" id="btnCancelarModal" class="btn-action btn-delete">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="modalActualizar" class="modal-overlay" style="display: none;">
        <div class="modal-content card">
            <h3>Editar concepto</h3>
            
            <div class="form-group">
                <label>Nuevo nombre del Concepto:</label>
                <input type="text" id="modalNombreActualizar" placeholder="Ej. Pago de Internet">
            </div>

            <div class="form-group">
                <label>Tipo:</label>
                <select id="modalTipoActualizar">
                    <option value="Ingreso">Ingreso</option>
                    <option value="Egreso">Egreso</option>
                </select>
            </div>

            <div class="form-group">
                <label>Categoría Padre:</label>
                <input type="text" id="modalCategoriaActualizar" placeholder="Ej. Servicios">
            </div>

            <div class="concept-actions">
                <button type="button" id="btnGuardarModalActualizar" class="btn-action btn-add">Guardar</button>
                <button type="button" id="btnCancelarModalActualizar" class="btn-action btn-delete">Cancelar</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
