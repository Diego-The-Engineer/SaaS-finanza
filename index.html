<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Finanzas</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .card { background: #1e1e1e; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        select, input, textarea, button { width: 100%; padding: 10px; background: #2d2d2d; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; }
        button { background: #2196f3; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #1e88e5; }
        .flex-charts { display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-around; }
        .chart-container { width: 100%; max-width: 450px; text-align: center; }
        ul { list-style: none; padding: 0; }
        li { background: #2d2d2d; padding: 15px; margin-bottom: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .es-ingreso { border-left: 5px solid #4caf50; }
        .es-egreso { border-left: 5px solid #f44336; }
        .filters { margin-bottom: 20px; }
        .filters button { width: auto; margin-right: 10px; background: #444; }
        .filters button:hover { background: #555; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SaaS Finanzas Dashboard</h1>
        <div class="card">
            <h2>Registrar Movimiento</h2>
            <form id="form-movimiento">
                <div class="form-group">
                    <label for="id_tipo">Tipo</label>
                    <select id="id_tipo" required>
                        <option value="">Selecciona tipo...</option>
                        <option value="Ingreso">Ingreso</option>
                        <option value="Egreso">Egreso</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="id_concepto">Concepto</label>
                    <select id="id_concepto" required>
                        <option value="">Primero selecciona el Tipo...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="monto">Monto ($)</label>
                    <input type="number" id="monto" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="fecha">Fecha de Operación</label>
                    <input type="date" id="fecha" required>
                </div>
                <div class="form-group">
                    <label for="notas">Notas</label>
                    <textarea id="notas" rows="3"></textarea>
                </div>
                <button type="submit">Guardar Registro</button>
            </form>
        </div>
        <div class="card">
            <h2>Gráficas de Rendimiento</h2>
            <div class="flex-charts">
                <div class="chart-container">
                    <h3>Ingresos por Categoría</h3>
                    <canvas id="graficoIngresos"></canvas>
                </div>
                <div class="chart-container">
                    <h3>Egresos por Categoría</h3>
                    <canvas id="graficoEgresos"></canvas>
                </div>
            </div>
        </div>
        <div class="card">
            <h2>Últimos Movimientos</h2>
            <div class="filters">
                <label for="filtro-mes">Filtrar por Mes</label>
                <select id="filtro-mes" onchange="cargarMovimientos()">
                    <option value="">Todos los meses</option>
                    <option value="01">Enero</option>
                    <option value="02">Febrero</option>
                    <option value="03">Marzo</option>
                    <option value="04">Abril</option>
                    <option value="05">Mayo</option>
                    <option value="06" selected>Junio</option>
                    <option value="07">Julio</option>
                    <option value="08">Agosto</option>
                    <option value="09">Septiembre</option>
                    <option value="10">Octubre</option>
                    <option value="11">Noviembre</option>
                    <option value="12">Diciembre</option>
                </select>
                <br><br>
                <button onclick="filtrarTipo('')">Todos</button>
                <button onclick="filtrarTipo('Ingreso')">Ingresos</button>
                <button onclick="filtrarTipo('Egreso')">Egresos</button>
            </div>
            <ul id="lista-movimientos"></ul>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
