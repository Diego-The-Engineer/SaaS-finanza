<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Finanzas MVP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SaaS Finanzas MVP</h1>
            <p>Control Financiero de alto rendimiento</p>
        </header>

        <section class="formulario">
            <h2>Registrar Movimiento</h2>
            <form id="form-movimiento">
                <select id="id_tipo" required><option value="">Tipo...</option><option value="Ingreso">Ingreso</option><option value="Egreso">Egreso</option></select>
                <select id="id_concepto" required><option value="">Primero selecciona el Tipo...</option></select>
                <input type="number" step="0.01" id="monto" placeholder="Monto ($)" required>
                <input type="text" id="notas" placeholder="Notas">
                <button type="submit">Guardar Registro</button>
            </form>
        </section>

        <section class="registros">
            <h2>Últimos Movimientos</h2>
            <div class="controles" style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button onclick="filtrarTipo('')">Todos</button>
                <button onclick="filtrarTipo('Ingreso')">Ingresos</button>
                <button onclick="filtrarTipo('Egreso')">Egresos</button>
                <select id="filtro-mes" onchange="cargarMovimientos()">
                    <option value="">Todo el año</option>
                    <option value="6">Junio</option>
                </select>
            </div>
            <ul id="lista-movimientos"></ul>
        </section>

        <section class="grafica" style="background-color: #222; padding: 20px; border-radius: 10px;">
            <h2 style="text-align: center;">Resumen Financiero</h2>
            <div style="display: flex; justify-content: space-around; flex-wrap: wrap; gap: 20px;">
                <div style="flex: 1; min-width: 300px;"><h3 style="text-align:center; color: #4caf50;">Ingresos</h3><canvas id="graficoIngresos"></canvas></div>
                <div style="flex: 1; min-width: 300px;"><h3 style="text-align:center; color: #f44336;">Egresos</h3><canvas id="graficoEgresos"></canvas></div>
            </div>
        </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
